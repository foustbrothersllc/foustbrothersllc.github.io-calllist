<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Driver click-to-call directory">
  <title>Driver Call List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ══════════════════════════════════════════════
       Sticky header: title, search, location filter
       ══════════════════════════════════════════════ -->
  <header class="header">
    <h1>📋 Driver Call List</h1>

    <div class="search-row">
      <input
        type="search"
        id="searchBox"
        placeholder="Search by name or number…"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="Search drivers"
      >
    </div>

    <div class="filter-btns" role="group" aria-label="Filter by location">
      <button class="filter-btn active" data-loc="all">All</button>
      <button class="filter-btn"        data-loc="greensboro">Greensboro</button>
      <button class="filter-btn"        data-loc="mebane">Mebane</button>
    </div>

    <p class="count-bar" id="countBar" aria-live="polite"></p>
  </header>

  <!-- ══════════════════════════════════════════════
       Card list — populated dynamically by app.js
       ══════════════════════════════════════════════ -->
  <main class="list" id="cardList">
    <div id="noResults" role="status">No drivers found matching your search.</div>
  </main>

  <script src="app.js"></script>
</body>
</html>
