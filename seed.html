<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seed Database</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    button { padding: 14px 28px; font-size: 16px; font-weight: bold; background: #351C15; color: #FFB500; border: none; border-radius: 10px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #log { margin-top: 20px; font-size: 14px; line-height: 1.8; white-space: pre-wrap; background: #f5f5f5; padding: 16px; border-radius: 8px; min-height: 100px; max-height: 400px; overflow-y: auto; }
  </style>
</head>
<body>
  <h2>🌱 Seed Firestore Database</h2>
  <p>Click the button to load all drivers from <code>drivers.json</code> into Firestore via REST API.</p>
  <button id="seedBtn">Start Seeding</button>
  <div id="log">Ready. Press Start Seeding to begin.</div>

<script>
const PROJECT_ID = 'call-list-editer';
const API_KEY    = 'AIzaSyDVgCrg8HyEgOLEN0f3A9L4LcqWhOqMX_g';
const BASE_URL   = 'https://firestore.googleapis.com/v1/projects/' + PROJECT_ID + '/databases/(default)/documents/drivers';

const log = document.getElementById('log');
const btn = document.getElementById('seedBtn');

function addLog(msg) {
  log.textContent += msg + '\n';
  log.scrollTop = log.scrollHeight;
}

function driverKey(lastName, firstName) {
  return (lastName + '|' + firstName).toLowerCase();
}
function keyToDocId(key) {
  return key.replace(/[^a-z0-9|]/g, '_');
}

function toFirestoreDoc(driver) {
  function toValue(val) {
    if (val === null || val === undefined) return { nullValue: null };
    if (typeof val === 'string') return { stringValue: val };
    if (typeof val === 'boolean') return { booleanValue: val };
    if (typeof val === 'number') return { integerValue: String(val) };
    if (typeof val === 'object') {
      const fields = {};
      for (const k in val) fields[k] = toValue(val[k]);
      return { mapValue: { fields } };
    }
    return { stringValue: String(val) };
  }
  const fields = {};
  for (const k in driver) fields[k] = toValue(driver[k]);
  return { fields };
}

btn.addEventListener('click', async function() {
  btn.disabled = true;
  log.textContent = '';
  addLog('Fetching drivers.json...');

  let drivers;
  try {
    const r = await fetch('drivers.json');
    drivers = await r.json();
    addLog('Loaded ' + drivers.length + ' drivers.');
  } catch(e) {
    addLog('ERROR loading JSON: ' + e.message);
    btn.disabled = false;
    return;
  }

  let done = 0;
  const total = drivers.length;

  for (let i = 0; i < drivers.length; i++) {
    const driver = drivers[i];
    const key   = driverKey(driver.lastName, driver.firstName);
    const docId = keyToDocId(key);
    const url   = BASE_URL + '/' + docId + '?key=' + API_KEY;

    try {
      const r = await fetch(url, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(toFirestoreDoc(driver))
      });
      if (!r.ok) {
        const err = await r.json();
        addLog('ERROR on ' + docId + ': ' + JSON.stringify(err));
        btn.disabled = false;
        return;
      }
      done++;
      if (done % 10 === 0 || done === total) {
        addLog('Written ' + done + ' / ' + total);
      }
    } catch(e) {
      addLog('FETCH ERROR on ' + docId + ': ' + e.message);
      btn.disabled = false;
      return;
    }

    // Small delay every 10 writes
    if (i % 10 === 9) {
      await new Promise(function(res) { setTimeout(res, 200); });
    }
  }

  addLog('\n✅ DONE! ' + total + ' drivers seeded successfully.');
  btn.textContent = '✅ Done!';
});
</script>
</body>
</html>
